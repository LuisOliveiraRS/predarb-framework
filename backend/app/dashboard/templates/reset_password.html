<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta name="robots" content="noindex,nofollow">

    <title>Redefinir senha | {{ app_name }}</title>

    <link
        rel="stylesheet"
        href="/dashboard/static/css/auth.css"
    >
</head>

<body class="auth-page">
    <main class="auth-layout">
        <section
            class="auth-card"
            aria-labelledby="reset-title"
        >
            <header class="auth-brand">
                <div class="auth-logo" aria-hidden="true">
                    PA
                </div>

                <div>
                    <span class="auth-product">PredArb</span>
                    <span class="auth-subtitle">
                        Nova credencial
                    </span>
                </div>
            </header>

            <div class="auth-heading">
                <p class="auth-eyebrow">
                    Link de recupera??o
                </p>

                <h1 id="reset-title">
                    Defina uma nova senha
                </h1>

                <p>
                    Utilize no m?nimo 12 caracteres e combine
                    letras, n?meros e s?mbolos.
                </p>
            </div>

            <form
                id="reset-form"
                class="auth-form"
                novalidate
            >
                <label for="new-password">
                    Nova senha
                </label>

                <input
                    id="new-password"
                    name="new_password"
                    type="password"
                    autocomplete="new-password"
                    minlength="12"
                    maxlength="1024"
                    required
                >

                <label for="confirm-password">
                    Confirme a nova senha
                </label>

                <input
                    id="confirm-password"
                    name="confirm_password"
                    type="password"
                    autocomplete="new-password"
                    minlength="12"
                    maxlength="1024"
                    required
                >

                <p
                    id="reset-message"
                    class="auth-message"
                    role="alert"
                    aria-live="polite"
                ></p>

                <button
                    id="reset-submit"
                    class="auth-submit"
                    type="submit"
                >
                    Atualizar senha
                </button>
            </form>

            <p class="auth-link-row">
                <a href="/esqueci-senha">
                    Solicitar outro link
                </a>
            </p>
        </section>
    </main>

    <script
        type="module"
        src="/dashboard/static/js/reset_password.js"
    ></script>
</body>
</html>
