<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <meta name="robots" content="noindex,nofollow">

    <title>Recuperar senha | {{ app_name }}</title>

    <link
        rel="stylesheet"
        href="/dashboard/static/css/auth.css"
    >
</head>

<body class="auth-page">
    <main class="auth-layout">
        <section
            class="auth-card"
            aria-labelledby="recovery-title"
        >
            <header class="auth-brand">
                <div class="auth-logo" aria-hidden="true">
                    PA
                </div>

                <div>
                    <span class="auth-product">PredArb</span>
                    <span class="auth-subtitle">
                        Recupera??o de acesso
                    </span>
                </div>
            </header>

            <div class="auth-heading">
                <p class="auth-eyebrow">
                    Conta protegida
                </p>

                <h1 id="recovery-title">
                    Esqueceu sua senha?
                </h1>

                <p>
                    Informe o e-mail administrativo para
                    receber um novo link de recupera??o.
                </p>
            </div>

            <form
                id="recovery-form"
                class="auth-form"
                novalidate
            >
                <label for="recovery-email">
                    E-mail
                </label>

                <input
                    id="recovery-email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    maxlength="320"
                    required
                >

                <p
                    id="recovery-message"
                    class="auth-message"
                    role="alert"
                    aria-live="polite"
                ></p>

                <button
                    id="recovery-submit"
                    class="auth-submit"
                    type="submit"
                >
                    Enviar novo link
                </button>
            </form>

            <p class="auth-link-row">
                <a href="/login">
                    Voltar para o login
                </a>
            </p>
        </section>
    </main>

    <script
        type="module"
        src="/dashboard/static/js/forgot_password.js"
    ></script>
</body>
</html>
